<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      border: 2px solid #000;
    }

    img {
      width: 100px;
      display: block;
      margin-bottom: 10px;
    }

    h2 {
      color: #2E8B57;
      margin-top: 0;
    }

    p {
      margin-bottom: 10px;
    }

    .section-title {
      color: #2E8B57;
      font-weight: bold;
      margin-top: 20px;
    }

    label {
      display: block;
      margin-top: 8px;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    select {
      width: 100%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-right: 6px;
    }

    input[type="submit"] {
      margin-top: 15px;
      padding: 8px 16px;
      background-color: #2E8B57;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #007ACC;
    }

    form {
      text-align: left;
    }

    /* Radio buttons nằm ngang */
    .radio-group label {
      display: inline-block;
      margin-right: 15px;
    }
  </style>
</head>

<body>
  <form>
    <img src="logo.png" alt="IU Logo" />

    <h2>Survey</h2>
    <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

    <p class="section-title">Your information:</p>
    <label>First Name: <input type="text" name="firstName" required /></label>
    <label>Last Name: <input type="text" name="lastName" required /></label>
    <label>Email: <input type="email" name="email" required /></label>
    <label>Date of Birth: <input type="date" name="dob" required /></label>

    <p class="section-title">How did you hear about us?</p>
    <div class="radio-group">
      <label><input type="radio" name="source" value="search" /> Search engine</label>
      <label><input type="radio" name="source" value="word" /> Word of mouth</label>
      <label><input type="radio" name="source" value="social" /> Social Media</label>
      <label><input type="radio" name="source" value="other" /> Other</label>
    </div>

    <p class="section-title">Would you like to receive announcements about new CDs and special offers?</p>
    <label><input type="checkbox" name="announce" value="yes1" /> YES, I'd like that.</label>
    <label><input type="checkbox" name="announce" value="yes2" /> YES, please send me email announcements.</label>

    <label>Please contact me by:
      <select name="contact">
        <option value="both">Email or postal mail</option>
        <option value="email">Email only</option>
        <option value="post">Postal mail only</option>
      </select>
    </label>

    <input type="submit" value="Submit" />
  </form>
</body>
</html>
