<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bố cục giống hình mẫu</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background-color: #f5b97a; /* Nền cam nhạt ngoài khung */
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-areas:
        "header header header"
        "sidebarA main sidebarB"
        "footer footer footer";
      grid-template-columns: 180px 1fr 180px; /* Giữ nguyên chiều rộng */
      grid-template-rows: 70px 550px 60px; /* Kéo dài phần giữa */
      width: 70%; /* Giữ khung gọn, không bè ngang */
      margin: 20px auto;
      background-color: #fff;
      border: 2px solid #f7c58a; /* Viền ngoài cam nhạt */
      box-sizing: border-box;
    }

    header {
      grid-area: header;
      border-bottom: 2px solid #f7c58a;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 1.1em;
      background-color: #fff;
      display: flex;
      align-items: center;
    }

    footer {
      grid-area: footer;
      border-top: 2px solid #f7c58a;
      padding: 10px 20px;
      font-weight: bold;
      background-color: #fff;
      display: flex;
      align-items: center;
    }

    .sidebarA {
      grid-area: sidebarA;
      border-right: 2px solid #f7c58a;
      padding: 10px 15px;
      font-weight: bold;
      background-color: #fff;
      display: flex;
      align-items: flex-start;
    }

    .sidebarB {
      grid-area: sidebarB;
      border-left: 2px solid #f7c58a;
      padding: 10px 15px;
      font-weight: bold;
      background-color: #fff;
      display: flex;
      align-items: flex-start;
    }

    .main {
      grid-area: main;
      padding: 10px 20px;
      font-weight: bold;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>Header</header>
    <div class="sidebarA">Sidebar A</div>
    <div class="main">Main content</div>
    <div class="sidebarB">Sidebar B</div>
    <footer>Footer</footer>
  </div>
</body>
</html>
